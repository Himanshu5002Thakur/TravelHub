<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title},~{::body})}">
<head><title>Sign Up | TravelHub</title></head>
<body>
    <div class="auth-page signup">
        <div class="auth-shell auth-shell-wide">
            <div>
                <h2 class="auth-title text-center text-success"><i class="fas fa-user-plus me-2"></i>Join TravelHub</h2>
                
                <form th:action="@{/signup}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Full Name</label>
                           <input type="text" th:field="*{username}" class="form-control px-3"
                               placeholder="John Doe" pattern="[A-Za-z ]{2,50}" maxlength="50"
                               title="Name should contain only letters and spaces (2-50 characters)." required>
                        <small class="text-muted">Only letters and spaces allowed.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email (Used for Login)</label>
                           <input type="email" th:field="*{email}" class="form-control px-3"
                               placeholder="john@gmail.com"
                               pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
                               title="Please enter a valid email address." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Password</label>
                           <input type="password" th:field="*{password}" class="form-control px-3"
                               placeholder="••••••••"
                               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,64}"
                               title="Minimum 8 characters with uppercase, lowercase, and number." required>
                        <small class="text-muted">Use 8+ characters with uppercase, lowercase and one number.</small>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mt-2">Create Account</button>
                </form>

                <div th:if="${error}" class="alert alert-danger mt-3 small p-2 text-center" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success mt-3 small p-2 text-center" th:text="${success}"></div>

                <p class="text-center mt-4 small">Already have an account? <a th:href="@{/login}" class="text-decoration-none fw-bold">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
