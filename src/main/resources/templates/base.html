<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title,content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">TravelHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/premium-pages.css}" rel="stylesheet">
    <style>
        :root {
            --app-bg: #f4f7fb;
            --app-ink: #0f172a;
            --app-muted: #475569;
            --app-primary: #0d6efd;
            --app-primary-dark: #0b5ed7;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--app-ink);
            background:
                radial-gradient(circle at 8% 0%, rgba(13, 110, 253, 0.08), transparent 30%),
                radial-gradient(circle at 95% 14%, rgba(240, 165, 0, 0.12), transparent 32%),
                var(--app-bg);
        }

        .navbar {
            background: linear-gradient(95deg, #0f3e85, #0d6efd) !important;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
            backdrop-filter: blur(6px);
        }

        .navbar-brand {
            letter-spacing: 0.01em;
        }

        .nav-link {
            border-radius: 9px;
            padding: 7px 10px !important;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .card {
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 15px;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 26px rgba(15, 23, 42, 0.12) !important;
        }

        .btn-primary {
            border-radius: 11px;
            padding: 10px 20px;
            font-weight: 700;
            background: linear-gradient(180deg, var(--app-primary) 0%, var(--app-primary-dark) 100%);
            border: 0;
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.24);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: linear-gradient(180deg, #1b76ff 0%, #0b5ed7 100%);
        }

        footer {
            background: linear-gradient(180deg, #0f172a 0%, #111827 100%) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        footer p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" th:href="@{/home}"><i class="fas fa-paper-plane me-2"></i>TravelHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" th:href="@{/home}"><i class="fas fa-home"></i> Home</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/about}"><i class="fas fa-info-circle"></i> About</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/contact}"><i class="fas fa-envelope"></i> Contact</a></li>

        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link text-warning fw-bold" th:href="@{/my-bookings}"><i class="fas fa-history"></i> My Bookings</a>
        </li>

        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/report}"><i class="fas fa-chart-pie"></i> My Report</a>
        </li>

        <li class="nav-item" sec:authorize="isAuthenticated()">
            <span class="navbar-text text-white me-3">
    <i class="fas fa-user"></i>
    <span th:text="${displayName != null ? displayName : 'Guest'}">User</span>
</span>
        </li>

        <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link nav-link text-danger p-0 border-0" style="vertical-align: baseline;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </li>

        <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="btn btn-light btn-sm rounded-pill px-4 ms-2" th:href="@{/login}">Login</a>
        </li>
    </ul>
</div>
        </div>
    </nav>
    <div th:replace="${content}"></div>

    <footer class="bg-dark text-white py-5 mt-5 text-center">
        <p>© 2026 TravelHub. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
