<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
th:replace="~{base :: layout(~{::title},~{::body})}">

<head>
<title>Confirm Booking</title>
</head>

<body>
<div class="booking-confirm-page">
<div class="container py-4 pb-5">
	<div class="confirm-shell">
		<div class="confirm-head">
			<h1><i class="fas fa-check-circle me-2"></i>Confirm Your Booking</h1>
			<p class="mb-0 text-white-50">Review your trip summary and continue to secure payment.</p>
		</div>

		<div class="confirm-body text-center">
			<div class="mb-2 text-muted small text-uppercase">Destination</div>
			<h3 class="text-primary fw-bold mb-2" th:text="${place}">Place</h3>

			<p class="text-muted mb-2">5 Days / 4 Nights Premium Package</p>
			<div class="confirm-price">₹25,000</div>
			<p class="text-muted mb-4">Per Person</p>

			<div class="d-grid gap-2">
				<button class="btn btn-warning w-100 fw-bold">
					<i class="fas fa-credit-card me-1"></i> Pay Now
				</button>
				<button class="btn btn-success w-100 fw-bold">
					<i class="fas fa-check me-1"></i> Confirm Booking
				</button>
				<a th:href="@{/home}" class="btn btn-outline-secondary w-100">
					Back to Home
				</a>
			</div>
		</div>
	</div>
</div>
</div>

</body>
</html>
