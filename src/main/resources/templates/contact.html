<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title},~{::body})}">

<head>
<title>Contact Us</title>
</head>

<body>

<div class="contact-page">
<div class="container py-4 pb-5">

<section class="contact-hero text-center">
    <p class="contact-kicker mb-1">Reach Out</p>
    <h1 class="contact-title"><i class="fas fa-envelope-open-text me-2"></i>Contact Us</h1>
    <p class="contact-subtitle">Have questions about your trip? Our team is ready to help you plan better.</p>
</section>

<div class="row g-4 justify-content-center">
    <div class="col-lg-7">
        <div class="contact-card">
            <div th:if="${success}" class="alert alert-success mb-4" role="alert">
                <i class="fas fa-check-circle me-1"></i>
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/contact}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Your Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your full name"
                           pattern="[A-Za-z ]{2,50}" maxlength="50"
                           title="Name should contain only letters and spaces (2-50 characters)." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Your Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@gmail.com"
                           pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
                           title="Please enter a valid email address." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Message</label>
                    <textarea name="message" class="form-control" rows="5" maxlength="600"
                              placeholder="Tell us your travel plan, preferred destination, and dates." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">
                    <i class="fas fa-paper-plane me-1"></i> Send Message
                </button>
            </form>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="contact-info-card h-100">
            <h5 class="fw-bold mb-3">Contact Details</h5>
            <p class="text-muted mb-4">We usually respond within 2-6 hours during business time.</p>

            <div class="contact-info-line mb-3">
                <i class="fas fa-envelope text-primary"></i>
                <span>honey14052005@gmail.com</span>
            </div>

            <div class="contact-info-line mb-4">
                <i class="fas fa-phone text-success"></i>
                <span>+91-9015409405</span>
            </div>

            <a th:href="@{/home}" class="btn btn-outline-secondary rounded-pill px-4">Back to Home</a>
        </div>
    </div>
</div>

</div>
</div>

</body>
</html>
